version: '3.8'

x-default-network: &default-network
  networks:
    - ecommerce-network

services:
  # --------------------------------------------------------
  # 1. PostgreSQL (Relacional) - Transações e Clientes
  # --------------------------------------------------------
  postgres:
    image: postgres:15-alpine
    container_name: pg_transacional
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d ecommerce_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    <<: *default-network

  # --------------------------------------------------------
  # 2. MongoDB (NoSQL) - Catálogo de Produtos
  # --------------------------------------------------------
  mongodb:
    image: mongo:6.0
    container_name: mongo_catalogo
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${DB_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${DB_PASSWORD}
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    <<: *default-network

  # --------------------------------------------------------
  # 3. Zookeeper & Apache Kafka (Streaming) - Clickstream
  # --------------------------------------------------------
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    <<: *default-network

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: kafka_broker
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      # Configuração essencial para acessar o Kafka de fora do contêiner (seu Python local) e de dentro (Spark)
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    <<: *default-network

# --------------------------------------------------------
# Configurações Globais
# --------------------------------------------------------
volumes:
  pg_data:
  mongo_data:

networks:
  ecommerce-network:
    driver: bridge
