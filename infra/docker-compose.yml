x-default-network: &default-network
  networks:
    - ecommerce-network

services:
  # --------------------------------------------------------
  # 1. PostgreSQL (Relacional) - Transações e Clientes
  # --------------------------------------------------------
  postgres:
    image: postgres:15-alpine
    container_name: pg_transacional
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d ecommerce_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    <<: *default-network

  # --------------------------------------------------------
  # 2. MongoDB (NoSQL) - Catálogo de Produtos
  # --------------------------------------------------------
  mongodb:
    image: mongo:6.0
    container_name: mongo_catalogo
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${DB_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${DB_PASSWORD}
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    <<: *default-network

  # --------------------------------------------------------
  # 3. Zookeeper & Apache Kafka (Streaming) - Clickstream
  # --------------------------------------------------------
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    <<: *default-network

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: kafka_broker
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      # Configuração essencial para acessar o Kafka de fora do contêiner (seu Python local) e de dentro (Spark)
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    <<: *default-network

  # --------------------------------------------------------
  # 4. Apache Airflow (Orquestração de Pipelines)
  # --------------------------------------------------------
  postgres-airflow:
    image: postgres:15-alpine
    container_name: pg_airflow
    environment:
      POSTGRES_USER: ${AIRFLOW_DB_USER}
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD}
      POSTGRES_DB: ${AIRFLOW_DB_NAME}
    ports:
      - "5433:5432" # Porta 5433 para não dar conflito com o pg_transacional
    volumes:
      - pg_airflow_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 10s
      timeout: 5s
      retries: 5
    <<: *default-network

  airflow-init:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    container_name: airflow_init
    depends_on:
      postgres-airflow:
        condition: service_healthy
    environment:
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://${AIRFLOW_DB_USER}:${AIRFLOW_DB_PASSWORD}@pg_airflow:5432/${AIRFLOW_DB_NAME}
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__WEBSERVER__SECRET_KEY=esta_e_uma_chave_secreta_muito_longa_e_segura_para_evitar_erro_403
    <<: *default-network
    command: >
      bash -c "airflow db migrate &&
               airflow users create --username ${AIRFLOW_WEB_USER} --password ${AIRFLOW_WEB_PASSWORD} --firstname Admin --lastname User --role Admin --email admin@example.com"

  airflow-webserver:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    container_name: airflow_webserver
    restart: always
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment:
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://${AIRFLOW_DB_USER}:${AIRFLOW_DB_PASSWORD}@pg_airflow:5432/${AIRFLOW_DB_NAME}
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - AIRFLOW__WEBSERVER__SECRET_KEY=${AIRFLOW__WEBSERVER__SECRET_KEY}
      - AIRFLOW__WEBSERVER__EXPOSE_CONFIG=True
      - GOOGLE_APPLICATION_CREDENTIALS=${GOOGLE_APPLICATION_CREDENTIALS}
      - GCP_PROJECT_ID=${GCP_PROJECT_ID}
      - GCP_DATASET=${GCP_DATASET}
      - GCP_STAGING_BUCKET=${GCP_STAGING_BUCKET}
    ports:
      - "8080:8080"
    volumes:
      - ../dags:/opt/airflow/dags
      - ../src/jobs:/opt/airflow/jobs
      - ../data:/opt/airflow/data
      - ../infra/gcp_key.json:/opt/airflow/gcp_key.json:ro
    <<: *default-network
    command: webserver

  airflow-scheduler:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    container_name: airflow_scheduler
    restart: always
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment:
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://${AIRFLOW_DB_USER}:${AIRFLOW_DB_PASSWORD}@pg_airflow:5432/${AIRFLOW_DB_NAME}
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - AIRFLOW__WEBSERVER__SECRET_KEY=esta_e_uma_chave_secreta_muito_longa_e_segura_para_evitar_erro_403
      - GOOGLE_APPLICATION_CREDENTIALS=/opt/airflow/gcp_key.json
      - GCP_PROJECT_ID=seu-id-de-projeto-real
      - GCP_DATASET=seu_dataset_real
      - GCP_STAGING_BUCKET=seu_bucket_real
    volumes:
      - ../dags:/opt/airflow/dags
      - ../src/jobs:/opt/airflow/jobs
      - ../data:/opt/airflow/data
      - ../infra/gcp_key.json:/opt/airflow/gcp_key.json:ro
    <<: *default-network
    command: scheduler

# --------------------------------------------------------
# Configurações Globais
# --------------------------------------------------------
volumes:
  pg_data:
  mongo_data:
  pg_airflow_data: # Novo volume para os metadados do Airflow

networks:
  ecommerce-network:
    driver: bridge
